# Vercel installerer fra [project] når pyproject.toml finnes, og hopper da over
# requirements.txt (AD-15 punkt 1). Lokalt brukes requirements.txt. En test holder dem like.
[project]
name = "your-next-adventure"
version = "0.1.0"
requires-python = ">=3.12,<3.16"
dependencies = [
    "Django==6.1.3",
    "anthropic==2.6.0",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
]

# Byggesteget på Vercel (AD-15 punkt 4). `lastinn` kommer i story 1.6.
[tool.vercel.scripts]
build = "python manage.py migrate --noinput"

# Ruff er linter og formatter (AD-13, AR-15).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Genererte migreringer har lange hjelpetekster fra Django som ikke kan brytes.
"*/migrations/*" = ["E501"]
