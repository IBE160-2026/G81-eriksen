# Ruff er linter og formatter (AD-13, AR-15).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Genererte migreringer har lange hjelpetekster fra Django som ikke kan brytes.
"*/migrations/*" = ["E501"]
