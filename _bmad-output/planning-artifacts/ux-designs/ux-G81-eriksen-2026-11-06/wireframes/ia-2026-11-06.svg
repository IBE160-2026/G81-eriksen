<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="60" y="112.95">Toppmeny – gjest</tspan></text>
<rect x="60" y="124" width="640" height="52" rx="13" ry="13" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
