<text font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="60" y="45.9">IA – Your Next Adventure (nettside, desktop, v1)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="60" y="74.95">Skjermer, ruter og tilgang. Kilde: PRD §6 + .memlog 2026-11-06. Gjest og bruker ser samme søkeskjema.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1660" y="30.95">Forklaring</tspan></text>
