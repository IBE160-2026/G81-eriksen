<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="790" y="279.1">«Nytt forslag» – blir i visningen</tspan></text>
<path d="M1910 330 L1910 232 L960 232 L960 330" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="953.24,315.5 960,330 966.76,315.5" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="1435" y="221.1">Åpne en tur fra historikken → vises som turforslag igjen</tspan></text>
<path d="M1000 420 L1200 420" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1185.5,426.76 1200,420 1185.5,413.24" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="1100" y="395.1">«Registrer gjennomført tur»</tspan><tspan x="1100" y="410.1">(innlogget)</tspan></text>
<path d="M1580 420 L1720 420" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1705.5,426.76 1720,420 1705.5,413.24" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="1650" y="395.1">Registrert →</tspan><tspan x="1650" y="410.1">suksessmelding</tspan></text>
<path d="M1720 530 L1580 530" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1594.5,523.24 1580,530 1594.5,536.76" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="1650" y="549.1">Registrer fra</tspan><tspan x="1650" y="564.1">historikken</tspan></text>
<path d="M880 630 L880 780" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="873.24,765.5 880,780 886.76,765.5" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="end" xml:space="preserve"><tspan x="868" y="675.1">«Registrer gjennomført tur»</tspan><tspan x="868" y="690.1">som gjest → logg inn / registrer</tspan></text>
<path d="M980 780 L980 630" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="986.76,644.5 980,630 973.24,644.5" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="992" y="661.1">Logget inn av andre grunner:</tspan><tspan x="992" y="676.1">retur dit hen var,</tspan><tspan x="992" y="691.1">turforslaget beholdes</tspan></text>
<path d="M1240 880 L1390 880 L1390 590" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1396.76,604.5 1390,590 1383.24,604.5" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1402" y="701.1">Utløst av «Registrer</tspan><tspan x="1402" y="716.1">gjennomført tur»:</tspan><tspan x="1402" y="731.1">rett inn i registrering</tspan><tspan x="1402" y="746.1">av den turen</tspan></text>
<path d="M1910 960 L1910 1060" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1903.24,1045.5 1910,1060 1916.76,1045.5" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="start" xml:space="preserve"><tspan x="1922" y="1009.1">«Slett konto»</tspan></text>
</svg>
