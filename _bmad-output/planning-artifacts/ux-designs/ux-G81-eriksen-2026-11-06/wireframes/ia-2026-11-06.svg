<polyline points="565.5,426.76 580,420 565.5,413.24" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" xml:space="preserve"><tspan x="510" y="395.1">«Finn en tur»</tspan><tspan x="510" y="410.1">(gyldig skjema)</tspan></text>
<path d="M580 540 L440 540" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
